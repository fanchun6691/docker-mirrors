name: rocky10prodbase Docker Image Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      # ============================================
      # 1. 释放 GitHub Runner 空间
      # ============================================
      - name: 释放 GitHub 空间
        run: |
          echo "=========================================="
          echo "释放磁盘空间"
          echo "=========================================="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo docker system prune -af
          sudo apt-get clean
          df -h
          echo "=========================================="

      # ============================================
      # 2. 检出代码
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 3. 验证必要文件是否存在
      # ============================================
      - name: 验证必要文件
        run: |
          echo "=========================================="
          echo "验证必要文件"
          echo "=========================================="
          
          if [ ! -f "Dockerfile.rocky10prodbase" ]; then
              echo "❌ 错误: Dockerfile.rocky10prodbase 不存在"
              exit 1
          fi
          echo "✅ Dockerfile.rocky10prodbase 存在"
          echo "=========================================="

      # ============================================
      # 4. 设置 Docker Buildx
      # ============================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # 5. 构建 Docker 镜像
      # ============================================
      - name: Build Docker image
        run: |
          docker build --no-cache -f Dockerfile.rocky10prodbase -t rocky10prodbase:latest .

      # ============================================
      # 6. 保存镜像为 tar.gz
      # ============================================
      - name: Save image as tarball
        run: |
          echo "=========================================="
          echo "保存镜像为 tar.gz"
          echo "=========================================="
          docker save rocky10prodbase:latest | gzip > rocky10prodbase.tar.gz
          ls -lh rocky10prodbase.tar.gz
          echo "=========================================="


      - name: 上传为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: rocky10prodbase
          path: rocky10prodbase.tar.gz

      - name: 生成直接下载链接
        run: |
          echo "✅ 镜像打包完成！"
          echo "👉 直接下载：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/1"
